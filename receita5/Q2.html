<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Questão 1 e 2: Estilização dos divs das cervejas */
        .cerveja-item {
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        /* Questão 3: Tabela estilizada */
        .tabela-cervejas {
            width: 100%;
            max-width: 400px;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .tabela-cervejas th,
        .tabela-cervejas td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .tabela-cervejas th {
            background-color: #007bff;
            color: white;
        }

        .tabela-cervejas tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .painel-botoes {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="painel-botoes">
        <button onclick="carregarCarros(carros)">Carregar Carros (DIVs)</button>
        <button onclick="carregarCarrosTabela(carros)">Carregar Carros (Tabela)</button>
        <button onclick="ordenarCarros(carros)">Mostrar Carros Ordenados</button>
        <button onclick="embaralharCarros(carros)">Embaralhar Carros</button>
    </div>

    <div id="meu amor">
        <table>
            <thead>
                <tr>
                    <th>Nome do Carro</th>
                </tr>
            </thead>
            <tbody id="lista-carros">

            </tbody>
        </table>
    </div>

    <script>
        let carros = ["Honda", "Corolla", "Ferrari", "BMW", "Mercedes", "Audi", "Porsche", "Lamborghini", "Maserati", "Jaguar"];


        const carregarCarros = (cars) => {
            const div = document.getElementById("meu amor");
            const carro_html = cars.map(nome => `<div>${nome}</div>`).join("");
            div.innerHTML = carro_html;
        }


        const carregarCarrosTabela = (cars) => {
            let linhasHtml = carros.map(carro => `<tr><td>${carro}</td></tr>`).join('')
            document.getElementById("lista-carros").innerHTML = linhasHtml
        }

        // Questão 4: Ordenar usando o método nativo sort()
        const ordenarCarros = (cars) => {
            cars.sort();
            carregarCarrosTabela();
        }

        // Questão 5: Embaralhar usando o método sort com comparador aleatório
        const embaralharCarros = (cars) => {
            cars.sort(() => Math.random() - 0.5);
            carregarCarrosTabela();
        }
    </script>
</body>

</html>
