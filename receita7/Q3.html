<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <style>
        table{
            border-collapse: collapse;
        }
        table, tr, td, th{
            border: 1px solid black;
        }
        td{
            background-color: lightgray;
        }
        thead{
            background-color: crimson;
            color: white
        }
    </style>


</head>


<body>

    <div><button id="botaoCarregar">Carregando Pokemons...</button></div>

    <div id="pokemonsDiv"></div>

</body>



<script>


    let natures = []



    const carregarDiv = cs => {

        const div = document.getElementById("pokemonsDiv")

        const itensHtml = cs.map(infos => `
        <tr>
            <td>${infos.name}</th>
            <td>${infos.id}</th>
            <td>${infos.decreased_stat ? infos.decreased_stat.name : 'Nenhum'}</th>
            <td>${infos.increased_stat ? infos.increased_stat.name : 'Nenhum'}</th>
        </tr>`)

        div.innerHTML = `<table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>ID</th>
                    <th>Diminui</th>
                    <th>Aumenta</th>    
                </tr>
            </thead>
            <tbody>
                ${itensHtml.join("\n")}
            </tbody>
        </table>`

    }



    async function carregarPokemon() {

        try {

            let res = await fetch("https://pokeapi.co/api/v2/nature/")

            const data = await res.json()
            for (let n of data.results) {
                let resDetalhes = await fetch(n.url)
                let dadosDetalhes = await resDetalhes.json()

                natures.push(dadosDetalhes)
            }


            carregarDiv(natures)

        } catch (err) {

            document.getElementById("pokemonsDiv").innerHTML = "Fudeu..."

        }

    }




    let botao = document.getElementById("botaoCarregar")

    botao.addEventListener("click", () => carregarPokemon())



</script>

</html>
