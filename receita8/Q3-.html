<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        table {
            border-collapse: collapse;
        }

        table, tr, td, th {
            border: 1px solid black;
        }

        td {
            background-color: lightgray;
        }

        thead {
            background-color: crimson;
            color: white;
        }
    </style>
</head>

<body>

    <div><button id="botaoCarregar">Carregar Natures</button></div>

    <div id="pokemonsDiv"></div>

    <script>
        let natures = []

        const carregarDiv = cs => {
            const div = document.getElementById("pokemonsDiv")

            const itensHtml = cs.map(infos => `
            <tr>
                <td>${infos.name}</td>
                <td>${infos.id}</td>
                <td>${infos.decreased_stat ? infos.decreased_stat.name : 'Nenhum'}</td>
                <td>${infos.increased_stat ? infos.increased_stat.name : 'Nenhum'}</td>
            </tr>`)

            div.innerHTML = `<table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>ID</th>
                        <th>Diminui</th>
                        <th>Aumenta</th>    
                    </tr>
                </thead>
                <tbody>
                    ${itensHtml.join("\n")}
                </tbody>
            </table>`
        }

        function carregarPokemon() {
            natures = [] // Reseta o array no início

            // 1º fetch: busca a lista de natures
            fetch("https://pokeapi.co/api/v2/nature/")
                .then(res => {
                    if (!res.ok) throw new Error(`Erro HTTP: ${res.status}`)
                    return res.json()
                })
                .then(data => {
                    // Mapeia os resultados criando um array de Promises para buscar os detalhes
                    const requisicoesDetalhes = data.results.map(n => 
                        fetch(n.url).then(resDetalhes => resDetalhes.json())
                    )

                    // Aguarda o término de todas as requisições em paralelo
                    return Promise.all(requisicoesDetalhes)
                })
                .then(dadosDetalhes => {
                    natures = dadosDetalhes
                    carregarDiv(natures)
                })
                .catch(err => {
                    console.error(err)
                    document.getElementById("pokemonsDiv").innerHTML = "Erro ao carregar dados..."
                })
        }

        let botao = document.getElementById("botaoCarregar")
        botao.addEventListener("click", carregarPokemon)
    </script>

</body>

</html>
